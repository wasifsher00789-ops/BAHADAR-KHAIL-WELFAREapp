name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Create package.json
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8 @capacitor/android@8 @capacitor/filesystem@8 @capacitor/share@8
          npm install --save-dev @capacitor/cli@8

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bahadurkhail.welfare",
            "appName": "Bahadur Khail Welfare",
            "webDir": "www"
          }
          EOF

      - name: Prepare app HTML
        run: |
          set -e
          test -f index.html
          rm -rf www
          mkdir -p www
          cp index.html www/index.html

      - name: Download Firebase SDK and PDF engine locally
        run: |
          set -e
          curl -fL --retry 3 --retry-delay 2 \
            https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js \
            -o www/firebase-app-compat.js

          curl -fL --retry 3 --retry-delay 2 \
            https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js \
            -o www/firebase-auth-compat.js

          curl -fL --retry 3 --retry-delay 2 \
            https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js \
            -o www/firebase-database-compat.js

          curl -fL --retry 3 --retry-delay 2 \
            https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js \
            -o www/html2pdf.bundle.min.js

          ls -lh www/

      - name: Verify required web files
        run: |
          set -e
          test -s www/index.html
          test -s www/firebase-app-compat.js
          test -s www/firebase-auth-compat.js
          test -s www/firebase-database-compat.js
          test -s www/html2pdf.bundle.min.js
          echo "All required web files are present."

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Verify packaged Android assets
        run: |
          set -e
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/firebase-app-compat.js
          test -f android/app/src/main/assets/public/firebase-auth-compat.js
          test -f android/app/src/main/assets/public/firebase-database-compat.js
          test -f android/app/src/main/assets/public/html2pdf.bundle.min.js
          echo "Firebase and PDF assets are packaged in Android."

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Check APK
        run: |
          set -e
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bahadur-Khail-Welfare-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
