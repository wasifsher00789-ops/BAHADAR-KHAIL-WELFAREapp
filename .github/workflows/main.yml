name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Create package.json
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/android@8
          npm install --save-dev @capacitor/cli@8

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bahadurkhail.welfare",
            "appName": "Bahadur Khail Welfare",
            "webDir": "www"
          }
          EOF

      - name: Prepare website
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android
        run: npx cap add android

      - name: Create Native Print Plugin
        run: |
          mkdir -p android/app/src/main/java/com/bahadurkhail/welfare

          cat > android/app/src/main/java/com/bahadurkhail/welfare/NativePrintPlugin.java <<'EOF'
          package com.bahadurkhail.welfare;

          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "NativePrint")
          public class NativePrintPlugin extends Plugin {

              @PluginMethod
              public void print(PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      try {
                          android.webkit.WebView webView =
                              getBridge().getWebView();

                          PrintManager manager =
                              (PrintManager)getActivity()
                              .getSystemService(Context.PRINT_SERVICE);

                          if (manager == null || webView == null) {
                              call.reject("Printing is not available");
                              return;
                          }

                          String name = call.getString(
                              "jobName",
                              "Bahadur Khail Welfare Report"
                          );

                          PrintDocumentAdapter adapter =
                              webView.createPrintDocumentAdapter(name);

                          manager.print(
                              name,
                              adapter,
                              new PrintAttributes.Builder().build()
                          );

                          call.resolve();

                      } catch (Exception e) {
                          call.reject(
                              e.getMessage() == null
                              ? "Print failed"
                              : e.getMessage()
                          );
                      }
                  });
              }
          }
          EOF

      - name: Register Native Print
        run: |
          cat > android/app/src/main/java/com/bahadurkhail/welfare/MainActivity.java <<'EOF'
          package com.bahadurkhail.welfare;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NativePrintPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Connect all report printing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")

          native = r'''
          function androidNativePrint(title){
            try{
              if(
                window.Capacitor &&
                window.Capacitor.Plugins &&
                window.Capacitor.Plugins.NativePrint
              ){
                window.Capacitor.Plugins.NativePrint.print({
                  jobName:title || 'Bahadur Khail Welfare Report'
                });
                return true;
              }
            }catch(e){
              console.error('Native print failed:',e);
            }
            return false;
          }
          '''

          if "function androidNativePrint(" not in s:
              pos = s.find("<script")
              if pos >= 0:
                  end = s.find(">", pos)
                  s = s[:end+1] + native + s[end+1:]

          # Monthly
          s = s.replace(
              "function printMonthlyReport(){",
              """function printMonthlyReport(){
          if(androidNativePrint('Bahadur Khail Welfare - Monthly Report')) return;
          """,
              1
          )

          # Report tabs: automatically add a native print button
          # after report content is rendered.
          hook = r'''
          function addNativeReportPrintButton(){
            try{
              const box=document.getElementById('reportBox');
              if(!box)return;

              if(box.querySelector('.native-report-print'))return;

              const btn=document.createElement('button');
              btn.className='btn native-report-print';
              btn.style.cssText='margin:10px 0;background:#1686c8;color:white';
              btn.textContent='🖨️ Print This Report';

              btn.onclick=function(){
                const title =
                  (typeof currentReportType!=='undefined' &&
                   currentReportType)
                  ? 'Bahadur Khail Welfare - '+currentReportType+' Report'
                  : 'Bahadur Khail Welfare Report';

                androidNativePrint(title);
              };

              box.insertBefore(btn,box.firstChild);
            }catch(e){
              console.error('Report print button:',e);
            }
          }
          '''

          if "function addNativeReportPrintButton(" not in s:
              s += "\n<script>\n" + hook + "\n</script>\n"

          # Call after report type changes.
          marker = "saveReportSnapshot(type,currentReportMonth||reportMonthValue())"
          if marker in s and "addNativeReportPrintButton();" not in s:
              s = s.replace(
                  marker,
                  marker + ";\n  setTimeout(addNativeReportPrintButton,100);",
                  1
              )

          p.write_text(s,encoding="utf-8")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Check APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bahadur-Khail-Welfare-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
