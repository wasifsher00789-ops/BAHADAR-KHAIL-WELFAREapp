name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Create package.json
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8 @capacitor/android@8
          npm install --save-dev @capacitor/cli@8

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bahadurkhail.welfare",
            "appName": "Bahadur Khail Welfare",
            "webDir": "www"
          }
          EOF

      - name: Prepare website
        run: |
          set -e

          test -f index.html

          rm -rf www
          mkdir -p www

          cp index.html www/index.html

          echo "index.html copied successfully"

      - name: Download Firebase SDK locally
        run: |
          set -e

          cd www

          curl -fL \
            https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js \
            -o firebase-app-compat.js

          curl -fL \
            https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js \
            -o firebase-auth-compat.js

          curl -fL \
            https://www.gstatic.com/firebasejs/12.7.0/firebase-database-compat.js \
            -o firebase-database-compat.js

          echo "Firebase SDK files downloaded:"
          ls -lh firebase-app-compat.js
          ls -lh firebase-auth-compat.js
          ls -lh firebase-database-compat.js

      - name: Change Firebase CDN paths to local files
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")

          s = s.replace(
              "https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js",
              "firebase-app-compat.js"
          )

          s = s.replace(
              "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js",
              "firebase-auth-compat.js"
          )

          s = s.replace(
              "https://www.gstatic.com/firebasejs/12.7.0/firebase-database-compat.js",
              "firebase-database-compat.js"
          )

          p.write_text(s, encoding="utf-8")
          PY

      - name: Verify Firebase SDK
        run: |
          set -e

          test -f www/firebase-app-compat.js
          test -f www/firebase-auth-compat.js
          test -f www/firebase-database-compat.js

          grep -q 'firebase-app-compat.js' www/index.html
          grep -q 'firebase-auth-compat.js' www/index.html
          grep -q 'firebase-database-compat.js' www/index.html

          echo "Firebase SDK verification PASSED"

      - name: Add Android
        run: |
          npx cap add android

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Verify Android web assets
        run: |
          set -e

          test -f www/index.html
          test -f www/firebase-app-compat.js
          test -f www/firebase-auth-compat.js
          test -f www/firebase-database-compat.js

          echo "Android web assets are ready"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Check APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bahadur-Khail-Welfare-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
