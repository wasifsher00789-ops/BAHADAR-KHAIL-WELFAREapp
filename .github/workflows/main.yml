name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Prepare website and bundle Firebase SDK locally
        run: |
          mkdir -p www
          cp index.html www/index.html
          curl -fL --retry 3 https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js -o www/firebase-app-compat.js
          curl -fL --retry 3 https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js -o www/firebase-auth-compat.js
          curl -fL --retry 3 https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js -o www/firebase-database-compat.js
          test -s www/firebase-app-compat.js
          test -s www/firebase-auth-compat.js
          test -s www/firebase-database-compat.js

      - name: Create Capacitor config
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.bahadurkhail.welfare",
            "appName": "Bahadurkhail Welfare Community",
            "webDir": "www"
          }
          EOF

      - name: Add Android Platform
        run: |
          npm install @capacitor/core @capacitor/android
          npx cap add android

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bhwc-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
