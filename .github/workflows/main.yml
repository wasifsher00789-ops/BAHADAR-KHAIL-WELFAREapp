name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Maven repositories
        run: |
          curl -I --retry 5 --retry-delay 3 \
            https://repo.maven.apache.org/maven2/
          curl -I --retry 5 --retry-delay 3 \
            https://dl.google.com/dl/android/maven2/

      - name: Create package
        run: |
          npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8 @capacitor/android@8
          npm install --save-dev @capacitor/cli@8

      - name: Prepare web files
        run: |
          set -e
          test -f index.html

          rm -rf www
          mkdir -p www

          cp index.html www/index.html

          echo "Web files:"
          ls -lh www/index.html

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bahadurkhail.welfare",
            "appName": "Bahadur Khail Welfare",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: npx cap add android

      - name: Configure Android repositories
        run: |
          python3 <<'PY'
          from pathlib import Path

          # settings.gradle
          p = Path("android/settings.gradle")
          if p.exists():
              s = p.read_text()

              s = s.replace(
                  "repositories {",
                  """repositories {
                      google()
                      mavenCentral()
                      maven { url 'https://dl.google.com/dl/android/maven2/' }
                      maven { url 'https://repo1.maven.org/maven2/' }""",
                  1
              )

              p.write_text(s)

          # root build.gradle
          p = Path("android/build.gradle")
          if p.exists():
              s = p.read_text()

              if "mavenCentral()" not in s:
                  s = s.replace(
                      "repositories {",
                      """repositories {
                          google()
                          mavenCentral()
                          maven { url 'https://repo1.maven.org/maven2/' }""",
                      1
                  )

              p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
        run: |
          cd android
          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --refresh-dependencies \
            --stacktrace

      - name: Verify APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bahadur-Khail-Welfare-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
