name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Create package
        run: npm init -y

      - name: Install Capacitor and Firebase
        run: |
          npm install @capacitor/core@8 @capacitor/android@8 firebase@12.16.0
          npm install --save-dev @capacitor/cli@8

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bahadurkhail.welfare",
            "appName": "Bahadur Khail Welfare",
            "webDir": "www"
          }
          EOF

      - name: Prepare index.html
        run: |
          set -e

          test -f index.html

          rm -rf www
          mkdir -p www

          cp index.html www/index.html

          echo "index.html:"
          ls -lh www/index.html

      - name: Install Firebase compat SDK files
        run: |
          set -e

          mkdir -p www/firebase

          cp node_modules/firebase/compat/app/dist/index.cjs.js \
             www/firebase/firebase-app-compat.js

          cp node_modules/firebase/compat/auth/dist/index.cjs.js \
             www/firebase/firebase-auth-compat.js

          cp node_modules/firebase/compat/database/dist/index.cjs.js \
             www/firebase/firebase-database-compat.js

          echo "Firebase files:"
          ls -lh www/firebase/

      - name: Patch Firebase scripts
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")

          # Remove old Firebase CDN script tags.
          s = re.sub(
              r'<script[^>]+firebase[^>]*></script>',
              '',
              s,
              flags=re.I
          )

          firebase_scripts = """
          <script src="firebase/firebase-app-compat.js"></script>
          <script src="firebase/firebase-auth-compat.js"></script>
          <script src="firebase/firebase-database-compat.js"></script>
          """

          if "</head>" in s:
              s = s.replace("</head>", firebase_scripts + "\n</head>", 1)
          else:
              s = firebase_scripts + "\n" + s

          p.write_text(s, encoding="utf-8")
          PY

          echo "Firebase references:"
          grep -n "firebase.*compat" www/index.html || true

      - name: Verify Firebase files
        run: |
          set -e

          test -f www/firebase/firebase-app-compat.js
          test -f www/firebase/firebase-auth-compat.js
          test -f www/firebase/firebase-database-compat.js

          echo "Firebase SDK files are present."

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Verify Android assets
        run: |
          set -e

          test -f www/index.html
          test -f www/firebase/firebase-app-compat.js
          test -f www/firebase/firebase-auth-compat.js
          test -f www/firebase/firebase-database-compat.js

          echo "Android web assets verified."

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Check APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bahadur-Khail-Welfare-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
