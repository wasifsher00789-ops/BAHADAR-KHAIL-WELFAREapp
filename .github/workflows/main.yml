name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Create package.json
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/android@8
          npm install --save-dev @capacitor/cli@8

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bahadurkhail.welfare",
            "appName": "Bahadur Khail Welfare",
            "webDir": "www"
          }
          EOF

      - name: Prepare website
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android
        run: npx cap add android

      - name: Add native Print plugin
        run: |
          mkdir -p android/app/src/main/java/com/bahadurkhail/welfare

          cat > android/app/src/main/java/com/bahadurkhail/welfare/NativePrintPlugin.java <<'EOF'
          package com.bahadurkhail.welfare;

          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "NativePrint")
          public class NativePrintPlugin extends Plugin {

              @PluginMethod
              public void print(PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      try {
                          android.webkit.WebView webView =
                              getBridge().getWebView();

                          PrintManager printManager =
                              (PrintManager) getActivity()
                                  .getSystemService(Context.PRINT_SERVICE);

                          if (printManager == null || webView == null) {
                              call.reject("Printing is not available");
                              return;
                          }

                          String jobName =
                              call.getString(
                                  "jobName",
                                  "Bahadur Khail Welfare Report"
                              );

                          PrintDocumentAdapter adapter =
                              webView.createPrintDocumentAdapter(jobName);

                          printManager.print(
                              jobName,
                              adapter,
                              new PrintAttributes.Builder().build()
                          );

                          call.resolve();

                      } catch (Exception e) {
                          call.reject(
                              e.getMessage() != null
                                  ? e.getMessage()
                                  : "Print failed"
                          );
                      }
                  });
              }
          }
          EOF

      - name: Register Print plugin
        run: |
          cat > android/app/src/main/java/com/bahadurkhail/welfare/MainActivity.java <<'EOF'
          package com.bahadurkhail.welfare;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NativePrintPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Connect Print button
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")

          old = "function printMonthlyReport(){"

          new = """function printMonthlyReport(){
          try{
            if(window.Capacitor &&
               window.Capacitor.Plugins &&
               window.Capacitor.Plugins.NativePrint){

              window.Capacitor.Plugins.NativePrint.print({
                jobName:'Bahadur Khail Welfare Monthly Report'
              });

              return;
            }
          }catch(e){
            console.error('Native print failed:',e);
          }

          """

          if old in s and "NativePrint.print" not in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Check APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bahadur-Khail-Welfare-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
