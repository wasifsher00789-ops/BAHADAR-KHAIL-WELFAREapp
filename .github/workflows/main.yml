name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Create package
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8 @capacitor/android@8 @capacitor/filesystem@8 @capacitor/share@8
          npm install --save-dev @capacitor/cli@8

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bahadurkhail.welfare",
            "appName": "Bahadur Khail Welfare",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Prepare web files
        run: |
          set -e
          test -f index.html
          rm -rf www
          mkdir -p www
          cp index.html www/index.html

      - name: Download Firebase and PDF libraries locally
        run: |
          set -e
          curl -fL https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js -o www/firebase-app-compat.js
          curl -fL https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js -o www/firebase-auth-compat.js
          curl -fL https://www.gstatic.com/firebasejs/12.7.0/firebase-database-compat.js -o www/firebase-database-compat.js
          curl -fL https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js -o www/html2pdf.bundle.min.js

      - name: Verify web dependencies
        run: |
          set -e
          for f in index.html firebase-app-compat.js firebase-auth-compat.js firebase-database-compat.js html2pdf.bundle.min.js; do
            test -s "www/$f"
            echo "OK: www/$f"
          done

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Verify Android assets
        run: |
          set -e
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/firebase-app-compat.js
          test -s android/app/src/main/assets/public/firebase-auth-compat.js
          test -s android/app/src/main/assets/public/firebase-database-compat.js
          test -s android/app/src/main/assets/public/html2pdf.bundle.min.js
          echo "All Firebase/PDF assets are inside Android APK assets."

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Check APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bahadur-Khail-Welfare-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
