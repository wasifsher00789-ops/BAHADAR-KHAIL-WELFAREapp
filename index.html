<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bahadurkhail Welfare Community</title>
  <style>
    :root {
      --bg-top: #0f172a;
      --bg-bottom: #1e293b;
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-hover: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --green: #4ade80;
      --green-soft: rgba(74, 222, 128, 0.15);
      --red: #f87171;
      --red-soft: rgba(248, 113, 113, 0.15);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    body {
      background: linear-gradient(135deg, var(--bg-top), var(--bg-bottom));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-icon {
      width: 40px; height: 40px; background: var(--accent); color: #0f172a;
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.2rem;
    }
    .brand-text h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; }
    .brand-text p { font-size: 0.75rem; color: var(--muted); }

    .status-badge {
      display: flex; align-items: center; gap: 0.5rem; background: var(--card-bg);
      border: 1px solid var(--card-border); padding: 0.4rem 0.8rem; border-radius: 20px;
      font-size: 0.8rem; font-weight: 500;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #e2e8f0; }
    .status-badge.online .status-dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-badge.offline .status-dot { background: var(--red); box-shadow: 0 0 8px var(--red); }

    .container { max-width: 1200px; width: 100%; margin: 0 auto; padding: 1.5rem; flex: 1; }

    .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: var(--radius); padding: 1.2rem; display: flex; flex-direction: column; justify-content: space-between;
    }
    .stat-label { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.5rem; }
    .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--text); }
    .stat-sub { font-size: 0.75rem; margin-top: 0.4rem; color: var(--accent); }

    .main-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    @media (min-width: 900px) { .main-grid { grid-template-columns: 350px 1fr; } }

    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; }
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.2rem; display: flex; align-items: center; justify-content: space-between; }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; font-weight: 500; }
    .form-control {
      width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border);
      border-radius: 8px; padding: 0.65rem 0.8rem; color: #fff; font-size: 0.9rem; outline: none; transition: 0.2s;
    }
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

    .btn {
      width: 100%; background: var(--accent); color: #0f172a; border: none;
      border-radius: 8px; padding: 0.75rem; font-weight: 600; font-size: 0.9rem;
      cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn:hover { background: var(--accent-hover); color: #fff; }

    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th { background: rgba(15, 23, 42, 0.4); color: var(--muted); font-weight: 600; padding: 0.8rem 1rem; border-bottom: 1px solid var(--card-border); }
    td { padding: 0.8rem 1rem; border-bottom: 1px solid var(--card-border); }
    tr:hover td { background: var(--card-hover); }

    .badge { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .badge-success { background: var(--green-soft); color: var(--green); }
    .badge-danger { background: var(--red-soft); color: var(--red); }

    #app-toast {
      position: fixed; bottom: 20px; right: 20px; background: #0284c7; color: white;
      padding: 0.75rem 1.2rem; border-radius: 8px; font-size: 0.85rem; font-weight: 500;
      box-shadow: var(--shadow); transform: translateY(100px); opacity: 0; transition: 0.3s; z-index: 1000;
    }
    #app-toast.show { transform: translateY(0); opacity: 1; }

    .loader {
      border: 2px solid rgba(255,255,255,0.1); border-left-color: var(--accent);
      border-radius: 50%; width: 18px; height: 18px; animation: spin 0.8s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand">
      <div class="brand-icon">B</div>
      <div class="brand-text">
        <h1>Bahadurkhail Welfare</h1>
        <p>Community App</p>
      </div>
    </div>
    <div class="status-badge offline" id="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">Connecting...</span>
    </div>
  </header>

  <main class="container">
    <div class="grid-stats">
      <div class="stat-card">
        <span class="stat-label">Total Members</span>
        <span class="stat-value" id="stat-members">0</span>
        <span class="stat-sub">Active Accounts</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Total Collected</span>
        <span class="stat-value" id="stat-collected">Rs 0</span>
        <span class="stat-sub">All-time Fund</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Total Payments</span>
        <span class="stat-value" id="stat-payments">0</span>
        <span class="stat-sub">Transactions</span>
      </div>
    </div>

    <div class="main-grid">
      <section>
        <div class="card">
          <div class="card-title">Add Member</div>
          <form id="form-member">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="m-name" class="form-control" placeholder="e.g. Ali Khan" required />
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="text" id="m-phone" class="form-control" placeholder="e.g. 03001234567" required />
            </div>
            <button type="submit" class="btn" id="btn-member">Save Member</button>
          </form>
        </div>

        <div class="card">
          <div class="card-title">Record Payment</div>
          <form id="form-payment">
            <div class="form-group">
              <label>Select Member</label>
              <select id="p-member" class="form-control" required>
                <option value="">Select Member</option>
              </select>
            </div>
            <div class="form-group">
              <label>Amount (PKR)</label>
              <input type="number" id="p-amount" class="form-control" placeholder="e.g. 1000" required />
            </div>
            <div class="form-group">
              <label>Date</label>
              <input type="date" id="p-date" class="form-control" required />
            </div>
            <button type="submit" class="btn" id="btn-payment">Record Payment</button>
          </form>
        </div>
      </section>

      <section>
        <div class="card">
          <div class="card-title">Members Directory</div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Phone</th>
                  <th>Joined</th>
                </tr>
              </thead>
              <tbody id="tbl-members">
                <tr><td colspan="3" style="text-align: center; color: var(--muted);">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Payment History</div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Member</th>
                  <th>Amount</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="tbl-payments">
                <tr><td colspan="3" style="text-align: center; color: var(--muted);">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="app-toast">Notification Message</div>

  <script>
    (function() {
      const firebaseConfig = {
        apiKey: "AIzaSy..." /* Your Config Here */,
        authDomain: "bahadurkhail-welfare-community.firebaseapp.com",
        databaseURL: "https://bahadurkhail-welfare-community-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "bahadurkhail-welfare-community",
        storageBucket: "bahadurkhail-welfare-community.appspot.com",
        messagingSenderId: "367252877543",
        appId: "1:367252877543:web:5d50aaaeaa411dc86ccbf8"
      };

      const cdnScripts = [
        "https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js",
        "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js",
        "https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"
      ];

      const localScripts = [
        "firebase-app-compat.js",
        "firebase-auth-compat.js",
        "firebase-database-compat.js"
      ];

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.onload = () => resolve(src);
          script.onerror = () => reject(new Error('Failed to load ' + src));
          document.head.appendChild(script);
        });
      }

      async function initFirebase() {
        try {
          await Promise.all(cdnScripts.map(loadScript));
        } catch (err) {
          try {
            await Promise.all(localScripts.map(loadScript));
          } catch (localErr) {
            showToast("Firebase initialization failed!");
            return;
          }
        }

        if (window.firebase) {
          if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
          }
          
          firebase.auth().signInAnonymously().catch(function(error) {
            console.error("Auth error", error);
          });

          const db = firebase.database();
          
          const connectedRef = db.ref(".info/connected");
          connectedRef.on("value", (snap) => {
            const statusBadge = document.getElementById("status-badge");
            const statusText = document.getElementById("status-text");
            if (snap.val() === true) {
              statusBadge.className = "status-badge online";
              statusText.innerText = "Online (Synced)";
            } else {
              statusBadge.className = "status-badge offline";
              statusText.innerText = "Offline";
            }
          });

          window.BHWC = {
            db: db,
            root: db.ref("appData")
          };

          setupAppLogic();
        }
      }

      function showToast(msg) {
        const toast = document.getElementById("app-toast");
        toast.innerText = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
      }

      function setupAppLogic() {
        const root = window.BHWC.root;
        document.getElementById("p-date").valueAsDate = new Date();

        root.on("value", (snapshot) => {
          const data = snapshot.val() || {};
          const members = data.members || {};
          const payments = data.payments || {};

          renderMembers(members);
          renderPayments(payments, members);
          renderStats(members, payments);
          populateMemberSelect(members);
        });

        document.getElementById("form-member").addEventListener("submit", (e) => {
          e.preventDefault();
          const name = document.getElementById("m-name").value.trim();
          const phone = document.getElementById("m-phone").value.trim();

          if (!name || !phone) return;

          const newRef = root.child("members").push();
          newRef.set({
            name: name,
            phone: phone,
            createdAt: new Date().toISOString()
          }, (err) => {
            if (err) showToast("Error saving member");
            else {
              showToast("Member added!");
              document.getElementById("form-member").reset();
            }
          });
        });

        document.getElementById("form-payment").addEventListener("submit", (e) => {
          e.preventDefault();
          const memberId = document.getElementById("p-member").value;
          const amount = parseFloat(document.getElementById("p-amount").value);
          const date = document.getElementById("p-date").value;

          if (!memberId || !amount || !date) return;

          const newRef = root.child("payments").push();
          newRef.set({
            memberId: memberId,
            amount: amount,
            date: date,
            createdAt: new Date().toISOString()
          }, (err) => {
            if (err) showToast("Error recording payment");
            else {
              showToast("Payment recorded!");
              document.getElementById("form-payment").reset();
              document.getElementById("p-date").valueAsDate = new Date();
            }
          });
        });
      }

      function renderMembers(members) {
        const tbody = document.getElementById("tbl-members");
        tbody.innerHTML = "";
        const keys = Object.keys(members);
        if (keys.length === 0) {
          tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--muted);">No members found</td></tr>`;
          return;
        }

        keys.reverse().forEach(key => {
          const m = members[key];
          const dateStr = m.createdAt ? new Date(m.createdAt).toLocaleDateString() : 'N/A';
          tbody.innerHTML += `
            <tr>
              <td><strong>${m.name}</strong></td>
              <td>${m.phone}</td>
              <td>${dateStr}</td>
            </tr>
          `;
        });
      }

      function renderPayments(payments, members) {
        const tbody = document.getElementById("tbl-payments");
        tbody.innerHTML = "";
        const keys = Object.keys(payments);
        if (keys.length === 0) {
          tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--muted);">No payments found</td></tr>`;
          return;
        }

        keys.reverse().forEach(key => {
          const p = payments[key];
          const memberName = members[p.memberId] ? members[p.memberId].name : 'Unknown';
          tbody.innerHTML += `
            <tr>
              <td><strong>${memberName}</strong></td>
              <td><span class="badge badge-success">Rs ${p.amount}</span></td>
              <td>${p.date}</td>
            </tr>
          `;
        });
      }

      function renderStats(members, payments) {
        const mCount = Object.keys(members).length;
        const pKeys = Object.keys(payments);
        const pCount = pKeys.length;
        let totalSum = 0;

        pKeys.forEach(k => {
          totalSum += (parseFloat(payments[k].amount) || 0);
        });

        document.getElementById("stat-members").innerText = mCount;
        document.getElementById("stat-payments").innerText = pCount;
        document.getElementById("stat-collected").innerText = "Rs " + totalSum.toLocaleString();
      }

      function populateMemberSelect(members) {
        const select = document.getElementById("p-member");
        const currentVal = select.value;
        select.innerHTML = `<option value="">Select Member</option>`;

        Object.keys(members).forEach(key => {
          const m = members[key];
          const opt = document.createElement("option");
          opt.value = key;
          opt.textContent = m.name + " (" + m.phone + ")";
          select.appendChild(opt);
        });

        select.value = currentVal;
      }

      window.addEventListener('DOMContentLoaded', initFirebase);
    })();
  </script>
</body>
</html>
